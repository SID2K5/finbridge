# Test profile. The datasource values are placeholders: integration tests replace
# them with the Testcontainers MySQL connection (see AbstractIntegrationTest).
spring:
  datasource:
    url: jdbc:mysql://replaced-by-testcontainers/test
    username: replaced
    password: replaced
  flyway:
    locations: classpath:db/migration

finbridge:
  security:
    jwt:
      secret: test-only-secret-test-only-secret-test-only-secret-0123456789
      expiration-minutes: 60
    bcrypt-strength: 4
    public-api-docs: false
  odoo:
    base-url: http://odoo.invalid:8069
    database: test
    api-key: ""
    retry-backoff: 0ms
    page-size: 2             # small on purpose, so the tests exercise paging
  bootstrap:
    admin-email: ""
    admin-password: ""
