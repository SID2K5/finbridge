# FinBridge backend configuration.
# No secret has a default here. Values come from real environment variables
# (Docker, AWS) or, for local runs, from the git-ignored .env file imported below.
#
# Secure by default: with no profile, there is no demo data and Swagger UI needs a login.
# Local development opts in with the "dev" profile (see application-dev.yml).

spring:
  application:
    name: finbridge
  config:
    # .env is KEY=VALUE, which Spring can read as a properties file.
    # Two locations so it works from finbridge/backend (Maven) and finbridge/ (IDE).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      discovery:
        enabled: false      # no index page listing what exists
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

finbridge:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    login:
      max-failed-attempts: 5
      lock-minutes: 15
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    bcrypt-strength: 12
    public-api-docs: false
  # Odoo 19 External JSON-2 API. The API key is the only secret and has no default:
  # without it the application still starts and reports Odoo as NOT_CONFIGURED.
  odoo:
    base-url: ${ODOO_URL:http://localhost:8069}
    database: ${ODOO_DB:finbridge}
    api-key: ${ODOO_API_KEY:}
    connect-timeout: 5s
    read-timeout: 30s
    max-attempts: 3          # timeouts, connection failures and 5xx are retried; 4xx never
    retry-backoff: 1s        # wait 1s before the 2nd attempt, 2s before the 3rd
    page-size: 100
  # Payment service (the simulator locally). SOAP for payments, REST for its health endpoint.
  payment:
    ws-url: ${PAYMENT_WS_URL:http://localhost:8090/ws}
    connect-timeout: 3s
    read-timeout: 10s
    max-attempts: 3            # how many times one payment may be sent after business failures
    simulator-url: ${SIM_URL:http://localhost:8090}
    simulator-api-key: ${SIM_API_KEY:}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-full-name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
