# nginx for the FinBridge dashboard.
#
# It serves the built single-page application and nothing else, unless BACKEND_URL is set,
# in which case /api is forwarded there (see 40-api-proxy.sh). In AWS the load balancer
# routes /api to the backend itself, so BACKEND_URL stays unset there.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- security headers, on every response ----
    # The application's own policy is also in index.html as a meta tag; a header is the only
    # place where frame-ancestors works.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # For the load balancer and the container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Present only when BACKEND_URL is set; otherwise this file is empty.
    include /etc/nginx/conf.d/api-proxy.inc;

    # File names under /assets carry a content hash, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else is a route of the single-page application. index.html itself is never
    # cached, so a new release is picked up on the next page load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
